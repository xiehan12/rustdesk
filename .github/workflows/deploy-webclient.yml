name: Deploy RustDesk Web Client to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'flutter/**'
      - '.github/workflows/deploy-webclient.yml'
  workflow_dispatch:

# 设置 GITHUB_TOKEN 的权限以允许部署到 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 只允许一个并发部署
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Web Client
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true
          
      - name: Flutter doctor
        run: flutter doctor -v
        
      - name: Get dependencies
        working-directory: ./flutter
        run: flutter pub get
        
      - name: Build Web
        working-directory: ./flutter
        run: |
          echo "Building RustDesk Web Client..."
          flutter build web --release \
            --web-renderer canvaskit \
            --base-href "/" \
            --dart-define=FLUTTER_WEB_USE_SKIA=true
          
      - name: List build output
        run: ls -la flutter/build/web
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: flutter/build/web
          
      - name: Create deployment package
        run: |
          cd flutter/build/web
          tar -czf ../../../rustdesk-webclient-${{ github.sha }}.tar.gz .
          
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-webclient
          path: rustdesk-webclient-${{ github.sha }}.tar.gz
          retention-days: 90

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
